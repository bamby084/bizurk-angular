<div class="mx-auto w-full h-full max-w-[440px] relative tabs-container">
  @if(this.appStore.isInitializing()){
    <app-loading></app-loading>
  }@else{
    <ion-tabs>
      <ion-tab-bar slot="bottom" class="h-[86px] rounded-tl-[52px] rounded-tr-[52px]">
        <ion-tab-button tab="home">
          <ion-icon [icon]="homeIcon()"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-tab-button>
        <ion-tab-button tab="currency">
          <ion-icon [icon]="currencyIcon()"></ion-icon>
          <ion-label>Currency</ion-label>
        </ion-tab-button>
        <ion-tab-button tab="settings">
          <ion-icon [icon]="settingsIcon()"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  }
</div>
